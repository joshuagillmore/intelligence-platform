# Alembic configuration for intel_platform's Postgres schema.
#
# The database URL is deliberately NOT here: env.py reads it from
# intel_platform.config.Settings (POSTGRES_URL), the one place config comes from.
# The app runs these migrations itself at startup (db.engine.init_db); this file
# is for running them by hand, from backend/:
#
#   uv run alembic upgrade head          # apply
#   uv run alembic check                 # do the models and the migrations agree?
#   uv run alembic revision --autogenerate -m "what changed"
#
# See "Postgres schema migrations" in backend/CLAUDE.md.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
