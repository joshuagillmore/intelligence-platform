[project]
name = "intel-platform"
version = "0.1.0"
description = "AI-powered intelligence analyst workbench"
requires-python = ">=3.11"
dependencies = [
    "fastapi~=0.115.0",
    "uvicorn[standard]~=0.30.0",
    "neo4j~=5.0",
    "pydantic~=2.5",
    "pydantic-settings~=2.0",
    "python-multipart~=0.0.9",
    "spacy~=3.7",
    "pypdf~=4.0",
    "thefuzz[speedup]~=0.22",
    "networkx~=3.2",
    "scipy~=1.12",
    "python-louvain~=0.16",
    "jellyfish~=1.0",
    "anthropic~=0.40.0",
    "openai>=1.50.0",
    "cohere~=5.1",
    "pyyaml~=6.0",
    "celery[redis]~=5.3",
    "redis~=5.0",
    "beautifulsoup4~=4.12",
    "aiohttp~=3.9",
    "mcp[cli]~=1.12.0",
    "pyjwt~=2.8",
    "bcrypt~=4.0",
    "crawl4ai~=0.8.6",
    "ddgs~=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intel_platform"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
