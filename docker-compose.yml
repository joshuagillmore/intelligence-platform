# Datastore passwords come from NEO4J_PASSWORD / POSTGRES_PASSWORD (shell or
# the root .env), defaulting to the dev value `changeme`. Each is read both by
# the datastore service and by the backend's connection settings below, so one
# variable sets both sides.

# The backend image, its configuration and its dependencies, shared by the API
# (`backend`) and the collection worker (`worker`).
x-backend: &backend
  build:
    context: ./backend
    dockerfile: Dockerfile
  env_file: .env
  environment:
    # Datastore connections use the compose service names and the same
    # password variables as the services above. These override .env, whose
    # localhost URLs are for running the backend outside compose.
    - NEO4J_URI=bolt://neo4j:7687
    - NEO4J_USER=neo4j
    - NEO4J_PASSWORD=${NEO4J_PASSWORD:-changeme}
    - POSTGRES_URL=postgresql+asyncpg://intel:${POSTGRES_PASSWORD:-changeme}@postgres:5432/intel_platform
    # Route per-document LLM/hybrid extraction to the in-stack Ollama so it's
    # local + rate-limit-free (overrides .env for the compose network URL).
    - EXTRACTION_MODE=hybrid
    - EXTRACTION_LLM_PROVIDER=ollama
    - OLLAMA_BASE_URL=http://ollama:11434
    # The API only enqueues collection runs; the `worker` service runs them.
    - COLLECTION_WORKER_MODE=worker
    # Local development runs on the dev credentials, so the fail-closed boot
    # check is off here, explicitly: the production image (root Dockerfile)
    # turns it on. A stack exposed beyond localhost sets REQUIRE_SECURE_AUTH=true
    # in .env (it is read from there for this substitution) along with real
    # secrets; see SECURITY.md.
    - REQUIRE_SECURE_AUTH=${REQUIRE_SECURE_AUTH:-false}
  depends_on:
    neo4j:
      condition: service_healthy
    postgres:
      condition: service_healthy
    ollama:
      condition: service_healthy

services:
  neo4j:
    image: neo4j:5-community
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-changeme}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: intel_platform
      POSTGRES_USER: intel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intel -d intel_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:0.35.0
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15s

  backend:
    <<: *backend
    ports:
      - "127.0.0.1:8000:8000"

  # Executes the collection runs the API queues (collection_jobs): crawling,
  # extraction and graph building happen here, not in the process serving the
  # UI. Polls Postgres, so it needs no port; it waits out the API creating
  # the tables on first boot. Scale with `docker compose up --scale worker=N`.
  worker:
    <<: *backend
    command: ["uv", "run", "python", "-m", "intel_platform.worker"]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # A build arg, not runtime env: `next build` bakes the rewrite
      # destination into the standalone server (see frontend/Dockerfile).
      args:
        BACKEND_URL: http://backend:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

  # ---------------------------------------------------------------------------
  # Optional collection-egress VPN/Tor sidecars — OFF by default.
  # Started only with: docker compose --profile vpn up
  # LOCAL / self-hosted only: gluetun needs NET_ADMIN + /dev/net/tun, which
  # Railway can't grant. Tor works anywhere. The backend reaches these by
  # service name (gluetun:8888 HTTP proxy, tor:9050 SOCKS5) once the profile is
  # up — it is NOT placed in gluetun's network namespace, so plain
  # `docker compose up` (no profile) is unaffected. There is deliberately no
  # hard depends_on from backend to these (that would force the profile).
  # ---------------------------------------------------------------------------
  gluetun:
    image: qmcgaw/gluetun:v3.41.3
    profiles: ["vpn"]
    cap_add:
      - NET_ADMIN
    devices:
      - "/dev/net/tun:/dev/net/tun"
    volumes:
      # Allow the backend's three control-server routes (status/IP/kill-switch)
      # through gluetun's default-deny auth. See gluetun-auth.toml.
      - "./gluetun-auth.toml:/gluetun/auth/config.toml:ro"
    ports:
      # Control server exposed host-local only (VPN status / kill-switch).
      # Host port 8001 (not 8000) to avoid colliding with the backend's host
      # 8000; the backend still reaches the control API in-network at
      # gluetun:8000 (gluetun_control_url), which is unaffected by this mapping.
      - "127.0.0.1:8001:8000"
    environment:
      VPN_SERVICE_PROVIDER: surfshark
      VPN_TYPE: ${SURFSHARK_VPN_TYPE:-wireguard}
      WIREGUARD_PRIVATE_KEY: ${SURFSHARK_WG_PRIVATE_KEY:-}
      WIREGUARD_ADDRESSES: ${SURFSHARK_WG_ADDRESSES:-}
      OPENVPN_USER: ${SURFSHARK_OVPN_USER:-}
      OPENVPN_PASSWORD: ${SURFSHARK_OVPN_PASSWORD:-}
      SERVER_COUNTRIES: ${SURFSHARK_COUNTRIES:-Netherlands}
      # A city inside that country (Surfshark: Toronto, Montreal, Vancouver);
      # empty lets gluetun pick any server in the country. Josh, 2026-09-30.
      SERVER_CITIES: ${SURFSHARK_CITIES:-}
      HTTPPROXY: "on"
      HTTPPROXY_LISTENING_ADDRESS: ":8888"
      HTTP_CONTROL_SERVER_ADDRESS: ":8000"
    restart: unless-stopped

  tor:
    image: osminogin/tor-simple:0.4.9.13
    profiles: ["vpn"]
    # SOCKS5 on 9050; no extra capabilities needed.
    restart: unless-stopped

volumes:
  neo4j_data:
  postgres_data:
  ollama_data:
