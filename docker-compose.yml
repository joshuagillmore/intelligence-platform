services:
  neo4j:
    image: neo4j:5-community
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: neo4j/changeme
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: intel_platform
      POSTGRES_USER: intel
      POSTGRES_PASSWORD: changeme
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intel -d intel_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --requirepass changeme
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "changeme", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Route per-document LLM/hybrid extraction to the in-stack Ollama so it's
      # local + rate-limit-free (overrides .env for the compose network URL).
      - EXTRACTION_MODE=hybrid
      - EXTRACTION_LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend

  # ---------------------------------------------------------------------------
  # Optional collection-egress VPN/Tor sidecars — OFF by default.
  # Started only with: docker compose --profile vpn up
  # LOCAL / self-hosted only: gluetun needs NET_ADMIN + /dev/net/tun, which
  # Railway can't grant. Tor works anywhere. The backend reaches these by
  # service name (gluetun:8888 HTTP proxy, tor:9050 SOCKS5) once the profile is
  # up — it is NOT placed in gluetun's network namespace, so plain
  # `docker compose up` (no profile) is unaffected. There is deliberately no
  # hard depends_on from backend to these (that would force the profile).
  # ---------------------------------------------------------------------------
  gluetun:
    image: qmcgaw/gluetun:latest
    profiles: ["vpn"]
    cap_add:
      - NET_ADMIN
    devices:
      - "/dev/net/tun:/dev/net/tun"
    volumes:
      # Allow the backend's three control-server routes (status/IP/kill-switch)
      # through gluetun's default-deny auth. See gluetun-auth.toml.
      - "./gluetun-auth.toml:/gluetun/auth/config.toml:ro"
    ports:
      # Control server exposed host-local only (VPN status / kill-switch).
      # Host port 8001 (not 8000) to avoid colliding with the backend's host
      # 8000; the backend still reaches the control API in-network at
      # gluetun:8000 (gluetun_control_url), which is unaffected by this mapping.
      - "127.0.0.1:8001:8000"
    environment:
      VPN_SERVICE_PROVIDER: surfshark
      VPN_TYPE: ${SURFSHARK_VPN_TYPE:-wireguard}
      WIREGUARD_PRIVATE_KEY: ${SURFSHARK_WG_PRIVATE_KEY:-}
      WIREGUARD_ADDRESSES: ${SURFSHARK_WG_ADDRESSES:-}
      OPENVPN_USER: ${SURFSHARK_OVPN_USER:-}
      OPENVPN_PASSWORD: ${SURFSHARK_OVPN_PASSWORD:-}
      SERVER_COUNTRIES: ${SURFSHARK_COUNTRIES:-Netherlands}
      HTTPPROXY: "on"
      HTTPPROXY_LISTENING_ADDRESS: ":8888"
      HTTP_CONTROL_SERVER_ADDRESS: ":8000"
    restart: unless-stopped

  tor:
    image: osminogin/tor-simple
    profiles: ["vpn"]
    # SOCKS5 on 9050; no extra capabilities needed.
    restart: unless-stopped

volumes:
  neo4j_data:
  postgres_data:
  ollama_data:
